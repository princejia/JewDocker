events {}

http {
  server {
    listen 80;

    # supabase-js 会把请求发到 <url>/rest/v1/<table>，
    # PostgREST 服务在根路径，这里做前缀剥离。
    location /rest/v1/ {
      proxy_pass http://postgrest:3000/;
      proxy_set_header Host $host;
      # supabase-js 额外发的 apikey 头 PostgREST 用不到，透传无害
      proxy_set_header Authorization $http_authorization;
    }

    location = /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
