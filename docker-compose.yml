services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: jewelry
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
      # 仅在数据卷为空时按文件名顺序执行一次
      - ./supabase/init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./supabase/init/02-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jewelry"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/jewelry
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_LOG_LEVEL: error

  # 把 supabase-js 约定的 /rest/v1 前缀映射到 PostgREST 根路径
  gateway:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - postgrest
    volumes:
      - ./docker/gateway.conf:/etc/nginx/nginx.conf:ro

  web:
    build:
      context: .
      args:
        COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
        COS_BUCKET: ${COS_BUCKET:?}
        COS_REGION: ${COS_REGION:?}
    restart: always
    depends_on:
      - gateway
    # 只绑回环地址，公网流量由宿主机 Nginx 反代进来
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SUPABASE_URL: http://gateway
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      # 仅用于首次创建超管，账号建好后可从 .env 移除
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      COS_REGION: ${COS_REGION:?}
      COS_BUCKET: ${COS_BUCKET:?}
      COS_SECRET_ID: ${COS_SECRET_ID:?}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      TZ: Asia/Shanghai
    volumes:
      - image-cache:/app/.next/cache/images

volumes:
  db-data:
  image-cache:
